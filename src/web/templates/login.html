<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - DawaiRx</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2387e5",
                        "background-light": "#f6f5f8",
                        "background-dark": "#150f23",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2a2438",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <!-- Header -->
    <header class="w-full border-b border-slate-200 dark:border-slate-800 bg-surface-light dark:bg-surface-dark px-6 py-4 lg:px-10">
        <div class="mx-auto flex max-w-7xl items-center justify-between">
            <div class="flex items-center gap-3 text-primary">
                <div class="flex items-center justify-center size-10 bg-primary/10 rounded-lg">
                    <span class="material-symbols-outlined text-3xl">medication_liquid</span>
                </div>
                <h1 class="text-xl lg:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">DawaiRx</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-4 lg:py-6 flex flex-col items-center justify-center">
        <div class="w-full max-w-sm">
            <!-- Login Card -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-lg border border-slate-200/50 dark:border-slate-700/50 overflow-hidden">
                <div class="p-6">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center justify-center size-12 rounded-full bg-primary/10 text-primary mb-3">
                            <span class="material-symbols-outlined text-2xl">lock</span>
                        </div>
                        <h2 class="text-xl font-semibold text-slate-900 dark:text-white mb-1">Welcome Back</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Sign in to your account to continue</p>
                    </div>

                    <div id="errorMessage" class="hidden mb-5 p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/30">
                        <p class="text-sm text-red-800 dark:text-red-300"></p>
                    </div>

                    <div id="successMessage" class="hidden mb-5 p-4 rounded-lg bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-900/30">
                        <p class="text-sm text-green-800 dark:text-green-300"></p>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label for="userId" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">User ID</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                                <input type="text" id="userId" name="userId" required
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-sm"
                                    placeholder="Enter your user ID">
                            </div>
                        </div>

                        <div>
                            <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                                <input type="password" id="password" name="password" required
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-sm"
                                    placeholder="Enter your password">
                            </div>
                        </div>

                        <button type="submit" id="loginButton"
                            class="w-full flex items-center justify-center gap-2 h-12 px-5 bg-primary hover:bg-primary/90 text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-[0.98]">
                            <span class="material-symbols-outlined text-lg">login</span>
                            <span>Sign In</span>
                        </button>
                    </form>

                    <!-- Register Link -->
                    <div class="mt-6 text-center">
                        <p class="text-sm text-slate-500 dark:text-slate-400">
                            Don't have an account?
                            <a href="#" id="registerLink" class="text-primary hover:text-primary/80 font-semibold underline decoration-slate-300 dark:decoration-slate-600 underline-offset-4 transition-colors">Register</a>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Register Form (Hidden by default) -->
            <div id="registerCard" class="hidden mt-6 bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div class="p-8">
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center size-16 rounded-full bg-primary/10 text-primary mb-4">
                            <span class="material-symbols-outlined text-4xl">person_add</span>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Create Account</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Register for a new account</p>
                    </div>

                    <form id="registerForm" class="space-y-4">
                        <div>
                            <label for="regUserId" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">User ID</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                                <input type="text" id="regUserId" name="userId" required
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary transition-colors"
                                    placeholder="Choose a user ID">
                            </div>
                        </div>

                        <div>
                            <label for="regEmail" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email (Optional)</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">email</span>
                                <input type="email" id="regEmail" name="email"
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary transition-colors"
                                    placeholder="Enter your email">
                            </div>
                        </div>

                        <div>
                            <label for="regPassword" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                                <input type="password" id="regPassword" name="password" required minlength="6"
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary transition-colors"
                                    placeholder="Enter password (min 6 characters)">
                            </div>
                        </div>

                        <button type="submit" id="registerButton"
                            class="w-full flex items-center justify-center gap-2 h-12 px-6 bg-primary hover:bg-primary/90 text-white text-base font-bold rounded-lg shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-[0.98]">
                            <span class="material-symbols-outlined">person_add</span>
                            <span>Register</span>
                        </button>
                    </form>

                    <div class="mt-6 text-center">
                        <p class="text-sm text-slate-500 dark:text-slate-400">
                            Already have an account?
                            <a href="#" id="backToLoginLink" class="text-primary hover:text-primary/80 font-semibold underline decoration-slate-300 dark:decoration-slate-600 underline-offset-4 transition-colors">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-200 dark:border-slate-800 py-6 text-center">
        <p class="text-xs text-slate-400 dark:text-slate-500">
            © 2024 DawaiRx. All rights reserved. Secure & Private.
        </p>
    </footer>

    <script>
        // Toggle between login and register forms
        const loginCard = document.querySelector('.bg-surface-light');
        const registerCard = document.getElementById('registerCard');
        const registerLink = document.getElementById('registerLink');
        const backToLoginLink = document.getElementById('backToLoginLink');

        registerLink?.addEventListener('click', (e) => {
            e.preventDefault();
            loginCard.closest('div').classList.add('hidden');
            registerCard.classList.remove('hidden');
        });

        backToLoginLink?.addEventListener('click', (e) => {
            e.preventDefault();
            registerCard.classList.add('hidden');
            loginCard.closest('div').classList.remove('hidden');
        });

        // Login form handler
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        loginForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Signing in...</span>';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_id: userId, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    window.location.href = '/';
                } else {
                    const errorText = data.detail || (Array.isArray(data.detail) ? data.detail.map(d => d.msg || d).join(', ') : 'Login failed');
                    errorMessage.querySelector('p').textContent = errorText;
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.querySelector('p').textContent = 'Network error. Please try again.';
                errorMessage.classList.remove('hidden');
            } finally {
                loginButton.disabled = false;
                loginButton.innerHTML = '<span class="material-symbols-outlined">login</span><span>Sign In</span>';
            }
        });

        // Register form handler
        const registerForm = document.getElementById('registerForm');
        const registerButton = document.getElementById('registerButton');

        registerForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('regUserId').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            registerButton.disabled = true;
            registerButton.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Registering...</span>';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        email: email || undefined,
                        password 
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    successMessage.querySelector('p').textContent = 'Registration successful! Redirecting...';
                    successMessage.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    const errorText = data.detail || (Array.isArray(data.detail) ? data.detail.map(d => d.msg || d).join(', ') : 'Registration failed');
                    errorMessage.querySelector('p').textContent = errorText;
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.querySelector('p').textContent = 'Network error. Please try again.';
                errorMessage.classList.remove('hidden');
            } finally {
                registerButton.disabled = false;
                registerButton.innerHTML = '<span class="material-symbols-outlined">person_add</span><span>Register</span>';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('auth_token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
