<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Runs - DawaiRx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2387e5;
            --primary-dark: #1964c8;
            --success: #10b981;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
            padding: 0;
            color: var(--gray-900);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-300: #d4d4d4;
            --gray-400: #a3a3a3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-800: #262626;
            --gray-900: #171717;
            --white: #ffffff;
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-md);
        }
        
        .header {
            background: var(--white);
            border-radius: 8px;
            padding: var(--spacing-lg) var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--gray-200);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0;
            letter-spacing: -0.02em;
        }
        
        .nav {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .nav-link {
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            color: var(--gray-600);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .nav-link:hover {
            background: var(--gray-100);
            color: var(--gray-900);
        }
        
        .main-card {
            background: var(--white);
            border-radius: 8px;
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
        }
        
        .status {
            padding: var(--spacing-md);
            border-radius: 6px;
            margin-bottom: var(--spacing-lg);
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .status.info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        .status.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .loading {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--gray-500);
            font-size: 14px;
        }
        
        .runs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-lg);
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--gray-200);
        }
        
        .runs-table thead {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }
        
        .runs-table th {
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 500;
            color: var(--gray-600);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .runs-table td {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
            font-size: 14px;
        }
        
        .runs-table tbody tr {
            transition: background 0.2s ease;
        }
        
        .runs-table tbody tr:hover {
            background: var(--gray-50);
            cursor: pointer;
        }
        
        .runs-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .run-id {
            font-family: 'Monaco', 'Courier New', monospace;
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
        }
        
        .run-id:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }
            
            .header {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }
            
            .main-card {
                padding: var(--spacing-lg);
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .main-card {
                padding: 25px;
            }
            
            .runs-table {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Previous Runs</h1>
            </div>
            <div class="nav">
                <a href="/" class="nav-link">Home</a>
                <a href="/runs" class="nav-link">Previous Runs</a>
            </div>
        </div>
        
        <div class="main-card">
            <div class="status" id="status"></div>
            
            <div id="loading" class="loading">
                <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
                Loading runs...
            </div>
            
            <table class="runs-table" id="runsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Run ID</th>
                        <th>Created</th>
                        <th>Medicines</th>
                        <th>Ordered</th>
                        <th>Sold</th>
                        <th>Issues</th>
                    </tr>
                </thead>
                <tbody id="runsBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Authentication helper
        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }
        
        function getAuthHeaders() {
            const token = getAuthToken();
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }
        
        function checkAuth() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }
        
        // Check authentication on page load
        if (!checkAuth()) {
            // Redirect will happen
        }
        
        // Logout handler
        const logoutLink = document.getElementById('logoutLink');
        if (logoutLink) {
            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_id');
                window.location.href = '/login';
            });
        }
        
        // Add error handler for 401 responses
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_id');
                window.location.href = '/login';
            }
            return response;
        };
        
        async function loadRuns() {
            try {
                const response = await fetch('/api/runs?limit=50', {
                    headers: getAuthHeaders()
                });
                
                document.getElementById('loading').style.display = 'none';
                
                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMessage = `Error: HTTP ${response.status}: ${response.statusText}`;
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.detail || errorMessage;
                    } catch (e) {
                        // If not JSON, use the text as-is
                        if (errorText) {
                            errorMessage = `Error: HTTP ${response.status}: ${errorText}`;
                        }
                    }
                    
                    const statusDiv = document.getElementById('status');
                    statusDiv.className = 'status error';
                    statusDiv.style.display = 'block';
                    statusDiv.innerHTML = `
                        <div>${errorMessage}</div>
                        <button onclick="loadRuns()" style="margin-top: 10px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
                    `;
                    return;
                }
                
                const data = await response.json();
                
                if (data.runs && data.runs.length > 0) {
                    const tbody = document.getElementById('runsBody');
                    tbody.innerHTML = '';
                    
                    data.runs.forEach(run => {
                        const row = document.createElement('tr');
                        const stats = run.stats || {};
                        const created = new Date(run.created_at).toLocaleString();
                        
                        row.innerHTML = `
                            <td class="run-id" onclick="showRunDetails('${run.run_id}')">${run.run_id}</td>
                            <td>${created}</td>
                            <td>${stats.total_medicines || 0}</td>
                            <td>${(stats.total_ordered || 0).toLocaleString()}</td>
                            <td>${(stats.total_sold || 0).toLocaleString()}</td>
                            <td>${stats.total_issues || 0}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    document.getElementById('runsTable').style.display = 'table';
                } else {
                    const statusDiv = document.getElementById('status');
                    statusDiv.className = 'status info';
                    statusDiv.style.display = 'block';
                    statusDiv.textContent = 'No runs found. Start by uploading files on the home page.';
                }
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = `
                    <div>Error loading reports</div>
                    <div style="color: #666; font-size: 0.9em; margin-top: 5px;">Error: ${error.message}</div>
                    <button onclick="loadRuns()" style="margin-top: 10px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
                `;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function showRunDetails(runId) {
            alert('Run details for: ' + runId + '\n\nUse the CLI to export:\npython -m src.cli.main runs export ' + runId);
        }
        
        // Load runs on page load
        loadRuns();
    </script>
</body>
</html>
