# This workflow will build and push a Docker container to Azure Container Registry and deploy to Azure Web App
# when a commit is pushed to your default branch.
#
# This workflow assumes you have already created:
# - Azure Container Registry (dawairxregistry)
# - Azure App Service web app (dawairx-app)
#
# To configure this workflow:
#
# 1. Create Azure service principal and store as GitHub secret:
#    az ad sp create-for-rbac --name "github-actions-dawairx" --role contributor \
#      --scopes /subscriptions/{subscription-id}/resourceGroups/DawaiRxRG \
#      --sdk-auth
#    Store the JSON output as GitHub secret: AZURE_CREDENTIALS
#
# 2. Download the Publish Profile for your Azure Web App from Azure Portal
#    Store as GitHub secret: AZURE_WEBAPP_PUBLISH_PROFILE
#
# 3. Update AZURE_WEBAPP_NAME, ACR_NAME, and RESOURCE_GROUP below if different
#
# For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions

name: Build and deploy DawaiRx to Azure Web App

env:
  AZURE_WEBAPP_NAME: dawairx-app
  ACR_NAME: dawairxregistry
  RESOURCE_GROUP: DawaiRxRG
  IMAGE_NAME: dawairx

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image to Azure Container Registry
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file Dockerfile . \
            --platform linux/amd64

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Restart Azure Web App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp restart \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }}
